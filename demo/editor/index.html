<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDFCanvasEditor — PDF Canvas Kit</title>
    <!--
      글꼴 확인용 웹폰트 (2026.08.21).

      **패키지는 웹폰트를 싣지 않는다** (ARCHITECTURE §21.3). 인스펙터에서 글꼴을 고르면
      실제로 모양이 바뀌는지 보려면 호스트가 이렇게 불러와야 한다. 실서비스라면 서브셋을
      만들어 자체 호스팅하는 편이 낫다 — docs/16-fonts.md 참고.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      }
      /* Thin dev-only bar so the editor can be exercised without a host app. */
      #app {
        display: flex;
        flex-direction: column;
      }
      .devbar {
        display: flex;
        gap: 10px;
        align-items: center;
        /* 좁은 폭에서 줄을 바꾼다. 한 줄로 두면 넘쳐서 body 에 가로 스크롤이 생긴다. */
        flex-wrap: wrap;
        padding: 6px 12px;
        background: #26262a;
        color: #e8e8e4;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        flex: none;
      }
      .devbar button {
        font: inherit;
        background: #3a3a40;
        color: inherit;
        border: 1px solid #4d4d55;
        border-radius: 3px;
        padding: 3px 9px;
        cursor: pointer;
      }
      .devbar .spacer {
        flex: 1;
      }
      .editor-host {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
