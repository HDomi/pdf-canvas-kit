# GitHub Pages 배포.
#
# 세 개를 한 사이트로 합친다.
#
#   /                 데모 랜딩 · editor · viewer · checks · spike  (별칭으로 소스를 본다)
#   /react/           React 예제                                    (설치된 dist 를 본다)
#   /vue/             Vue 예제                                      (같음)
#
# ## 왜 예제를 따로 빌드하는가
#
# `examples/*` 는 vite 별칭 없이 `node_modules` 에서 패키지를 해석한다 — `exports` 맵·진입점·
# `.d.ts` 를 검증하는 유일한 자리다. 데모와 같은 빌드에 합치면 그 검증이 사라진다.
#
# ## base 경로
#
# Pages 는 `/<repo>/` 서브패스에 올라간다. 절대 경로(`/pdfjs/...`)를 쓰면 전부 404 가 되고,
# 그 증상이 "PDF 는 열리는데 한글만 사라진다" 라 원인을 찾기 어렵다. `PAGES_BASE` 를 주고
# 앱은 `import.meta.env.BASE_URL` 로 읽는다.

name: Pages

on:
  push:
    branches: [main]
  # 수동 실행. 배포만 다시 하고 싶을 때 쓴다.
  workflow_dispatch:

# 동시 실행을 막는다. 두 배포가 겹치면 어느 쪽이 올라갔는지 알 수 없다.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # workspace 를 함께 설치한다. examples 가 심링크로 패키지를 본다.
      - run: npm ci

      # 예제가 dist 를 보므로 라이브러리 빌드가 선행돼야 한다.
      - run: npm run build

      # pdf.js 런타임 자산. 세 사이트가 각자 서빙해야 한다 — 없으면 worker 가 404 이고
      # cMap 이 없으면 한국어 글자가 조용히 사라진다.
      - name: pdf.js 자산 복사
        run: |
          node scripts/copy-pdfjs-assets.mjs demo/public/pdfjs
          node scripts/copy-pdfjs-assets.mjs examples/react/public/pdfjs
          node scripts/copy-pdfjs-assets.mjs examples/vue/public/pdfjs

      # 게이트. Pages 에 깨진 화면을 올리지 않는다.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run checks

      - name: 데모 빌드
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npx vite build --config vite.demo.config.ts

      - name: React 예제 빌드
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/react/
        run: npm run build --workspace @pck-example/react

      - name: Vue 예제 빌드
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/vue/
        run: npm run build --workspace @pck-example/vue

      - name: 한 사이트로 합친다
        run: |
          # 예제를 데모 산출물 아래로 옮긴다
          mkdir -p dist-demo/react dist-demo/vue
          cp -R examples/react/dist/. dist-demo/react/
          cp -R examples/vue/dist/. dist-demo/vue/
          # Pages 가 _ 로 시작하는 경로를 Jekyll 로 처리하지 않게 한다
          touch dist-demo/.nojekyll
          echo "--- 산출물 ---"
          ls dist-demo
          # pdf.js 자산이 세 곳 모두에 있어야 한다 — 없으면 한글이 조용히 사라진다
          for d in dist-demo dist-demo/react dist-demo/vue; do
            test -f "$d/pdfjs/pdf.worker.mjs" || { echo "FAIL: $d/pdfjs 없음"; exit 1; }
          done
          echo "pdf.js 자산 확인 ok"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
