<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React 소비 예제 — PDF Canvas Kit</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      }
      /* 편집기가 height: 100% 를 요구한다 (ARCHITECTURE §15.4). */
      #app {
        display: flex;
        flex-direction: column;
      }
      .devbar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 12px;
        background: #26262a;
        color: #e8e8e4;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        flex: none;
      }
      .devbar button {
        font: inherit;
        background: #3a3a40;
        color: inherit;
        border: 1px solid #4d4d55;
        border-radius: 3px;
        padding: 3px 9px;
        cursor: pointer;
      }
      .editor-host {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
