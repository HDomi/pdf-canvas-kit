<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewer — PDF Canvas Kit</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      .devbar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 12px;
        background: #26262a;
        color: #e8e8e4;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        flex: none;
      }
      .devbar button {
        font: inherit;
        background: #3a3a40;
        color: inherit;
        border: 1px solid #4d4d55;
        border-radius: 3px;
        padding: 3px 9px;
        cursor: pointer;
      }
      .devbar label {
        display: flex;
        gap: 4px;
        align-items: center;
        cursor: pointer;
      }
      /* 편집기와 뷰어를 나란히. 둘 다 height 체인이 필요하다 (ARCHITECTURE §15.4). */
      .split {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .pane {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .pane + .pane {
        border-left: 2px solid #26262a;
      }
      .pane-label {
        flex: none;
        padding: 3px 10px;
        background: #1c1c20;
        color: #9a9aa0;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .host {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="devbar">
        <button id="send">뷰어로 보내기 (toPublicDoc)</button>
        <label><input type="checkbox" id="narrow" /> 375px 폭</label>
        <span id="status"></span>
        <span style="margin-left: auto"><a href="/" style="color: #9a9aa0">← 목록</a></span>
      </div>
      <div class="split">
        <div class="pane">
          <div class="pane-label">Editor — 교사. 정답을 넣는다</div>
          <div class="host" id="editor"></div>
        </div>
        <div class="pane">
          <div class="pane-label">Viewer — 학생. 정답이 없다</div>
          <div class="host" id="viewer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
