<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewer — PDF Canvas Kit</title>
    <!--
      글꼴 확인용 웹폰트 (2026.08.21).

      **패키지는 웹폰트를 싣지 않는다** (ARCHITECTURE §21.3). 인스펙터에서 글꼴을 고르면
      실제로 모양이 바뀌는지 보려면 호스트가 이렇게 불러와야 한다. 실서비스라면 서브셋을
      만들어 자체 호스팅하는 편이 낫다 — docs/16-fonts.md 참고.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      .devbar {
        display: flex;
        gap: 10px;
        align-items: center;
        /* 좁은 폭에서 줄을 바꾼다. 한 줄로 두면 넘쳐서 body 에 가로 스크롤이 생긴다. */
        flex-wrap: wrap;
        padding: 6px 12px;
        background: #26262a;
        color: #e8e8e4;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        flex: none;
      }
      .devbar button {
        font: inherit;
        background: #3a3a40;
        color: inherit;
        border: 1px solid #4d4d55;
        border-radius: 3px;
        padding: 3px 9px;
        cursor: pointer;
      }
      .devbar label {
        display: flex;
        gap: 4px;
        align-items: center;
        cursor: pointer;
      }
      /*
        편집기와 뷰어를 **겹쳐 두고 탭으로 전환한다.** 나란히 두지 않는 이유:
        편집기는 데스크탑 전용 3분할이고 페이지 목록 240px + 인스펙터 280px 를 고정으로
        먹는다 (편집기는 데스크탑 전용, 뷰어만 반응형이다). 화면 절반에 넣으면 캔버스가 남는 폭만 쓰게 되어 못 쓴다.

        둘 다 항상 마운트해 둔다 — 탭을 옮길 때 편집기를 걷으면 undo 스택이 날아간다.
      */
      .stack {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .pane {
        position: absolute;
        inset: 0;
      }
      .pane[hidden] {
        /* display:none 이 아니라 visibility — 레이아웃을 유지해야 폭 측정이 살아 있다. */
        display: block;
        visibility: hidden;
      }
      .host {
        height: 100%;
      }
      .devbar .spacer {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="devbar">
        <button id="send">뷰어로 보내기 (toPublicDoc)</button>
        <button id="tab-editor" disabled>편집기</button>
        <button id="tab-viewer">뷰어</button>
        <label><input type="checkbox" id="narrow" /> 375px 폭</label>
        <span id="status"></span>
        <span class="spacer"><a href="../" style="color: #9a9aa0">← 목록</a></span>
      </div>
      <div class="stack">
        <div class="pane" id="pane-editor">
          <div class="host" id="editor"></div>
        </div>
        <div class="pane" id="pane-viewer" hidden>
          <div class="host" id="viewer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
